name: Community Platform CI
on:
  push:
    branches: [main]
    paths:
      - 'community-platform/**'
      - '.github/workflows/community-platform-ci.yml'
  pull_request:
    paths:
      - 'community-platform/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
